name: Build & Verify Web Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check TypeScript & Lint
        run: npm run lint

      - name: Build production site bundle
        run: npm run build

      - name: Upload build dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build-artifact
          path: dist/
          retention-days: 14
