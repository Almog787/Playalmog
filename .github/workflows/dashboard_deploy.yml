name: Dashboard Deploy
on:
  workflow_run:
    workflows: ["Execution Workers"]
    types: [completed]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Artifacts (State Checkpoints)
        uses: actions/download-artifact@v3
        with:
          name: run-results
          path: public/data/

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Dashboard (React/Vite)
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
