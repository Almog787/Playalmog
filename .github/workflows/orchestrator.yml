name: Orchestrator Loop

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours automatically
  workflow_dispatch:      # Allow manual start
  push:
    branches:
      - main              # Trigger automatically on code updates

jobs:
  prepare-matrix:
    name: Generate Dynamic Scheduler Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Fetch Current State & Calculate Next Bounds
        id: set-matrix
        run: |
          # Simulated dynamic scheduler logic: 
          # In production, this parses state.json and determines the next T bounds.
          # Here we output a JSON array defining parallel execution chunks.
          echo 'matrix=[{"t_start": 14500000, "t_end": 14550000}, {"t_start": 14550000, "t_end": 14600000}, {"t_start": 14600000, "t_end": 14650000}]' >> $GITHUB_OUTPUT

  dispatch-workers:
    name: Execute Computation Matrix
    needs: prepare-matrix
    strategy:
      matrix:
        bounds: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false # If one chunk fails (e.g. anomaly found), let others finish
    # Trigger the worker execution workflow natively as a reusable workflow
    uses: ./.github/workflows/worker_execution.yml
    with:
      t_start: ${{ matrix.bounds.t_start }}
      t_end: ${{ matrix.bounds.t_end }}
