name: Execution Worker

on:
  workflow_call:
    inputs:
      t_start:
        required: true
        type: number
      t_end:
        required: true
        type: number

jobs:
  compute-numeric:
    name: Numerical Search (T=${{ inputs.t_start }} to ${{ inputs.t_end }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment (C++20 / Rust & MPFR/GMP)
        run: |
          echo "Simulating environment setup..."
          # sudo apt-get install libmpfr-dev libgmp-dev
          # make engine-numeric

      - name: Run Riemann Scan (Numerical)
        run: |
          echo "Executing numerical search between ${{ inputs.t_start }} and ${{ inputs.t_end }}..."
          # Limits memory to 3.5GB to avoid OOM
          ulimit -v 3670016
          # ./engine-numeric --t-start ${{ inputs.t_start }} --t-end ${{ inputs.t_end }} --precision 256
          mkdir -p output
          echo '{"status": "SUCCESS"}' > output/state.json

      - name: Upload Numeric Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-results-numeric-${{ inputs.t_start }}
          path: output/

  compute-formal:
    name: Formal Verification (Lean 4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Lean 4 & Mathlib
        run: |
          echo "Simulating Lean 4 setup..."
          # elan install leanprover/lean4:nightly

      - name: Run Formal Verification
        run: |
          echo "Executing formal verification proofs..."
          # lean --make src/Verification.lean
          mkdir -p output
          echo '{"status": "FORMAL_SUCCESS"}' > output/formal_state.json

      - name: Upload Formal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-results-formal-${{ inputs.t_start }}
          path: output/
